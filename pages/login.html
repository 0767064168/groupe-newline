<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Admin – GroupeNewline</title>
  <meta name="description" content="Espace administration GroupeNewline." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <style>
    .login-page {
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 80%, rgba(212,175,55,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 20%, rgba(13,27,42,0.8) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(212,175,55,0.4);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }
    @keyframes float-particle {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .login-box {
      position: relative;
      z-index: 10;
      background: rgba(13,27,42,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .login-logo {
      display: block;
      height: 60px;
      margin: 0 auto 28px;
      filter: drop-shadow(0 0 20px rgba(212,175,55,0.3));
    }
    .login-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 40%, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-subtitle {
      color: var(--gray);
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 36px;
      letter-spacing: 0.5px;
    }
    .login-divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 36px;
      opacity: 0.5;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .input-wrapper label {
      display: block;
      font-size: 0.78rem;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-wrapper input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 14px 48px 14px 16px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: 0.3s;
      outline: none;
      box-sizing: border-box;
    }
    .input-wrapper input:focus {
      border-color: var(--gold);
      background: rgba(212,175,55,0.05);
    }
    .input-wrapper .input-icon {
      position: absolute;
      right: 16px;
      bottom: 14px;
      font-size: 1.1rem;
      opacity: 0.5;
    }
    .toggle-pw {
      cursor: pointer;
      user-select: none;
    }
    .btn-login {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--gold), #b8960a);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }
    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: 0.3s;
    }
    .btn-login:hover::after { background: rgba(255,255,255,0.12); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error {
      display: none;
      background: rgba(255,70,70,0.1);
      border: 1px solid rgba(255,70,70,0.3);
      color: #ff7070;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.88rem;
      margin-top: 16px;
      text-align: center;
    }
    .login-hint {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }
    .login-hint a {
      color: var(--gray);
      font-size: 0.85rem;
      transition: 0.3s;
    }
    .login-hint a:hover { color: var(--gold); }
    .demo-info {
      margin-top: 20px;
      background: rgba(212,175,55,0.06);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      text-align: center;
      line-height: 1.7;
    }
    .demo-info strong { color: var(--gold); }
  </style>
</head>
<body>
  <div class="login-particles" id="particles"></div>

  <div class="login-page">
    <div class="login-box">
      <img class="login-logo" src="../assets/images/logo1.png.jpeg" alt="GroupeNewline Logo" />
      <h1 class="login-title">Espace Admin</h1>
      <p class="login-subtitle">Panneau de gestion GroupeNewline</p>
      <div class="login-divider"></div>

      <form id="loginForm" novalidate>
        <div class="input-wrapper">
          <label for="email">Adresse Email</label>
          <input type="email" id="email" placeholder="admin@groupenewline.ci" autocomplete="email" required />
          <span class="input-icon">✉️</span>
        </div>
        <div class="input-wrapper">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          <span class="input-icon toggle-pw" id="togglePw" title="Afficher/masquer">👁️</span>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">🔐 &nbsp;Se connecter</button>
        <div class="login-error" id="loginError">❌ Email ou mot de passe incorrect. Réessayez.</div>
      </form>

      <div class="demo-info">
        <strong>Identifiants de démo :</strong><br/>
        Email : admin@groupenewline.ci<br/>
        Mot de passe : Admin2025!
      </div>

      <div class="login-hint">
        <a href="../index.html">← Retour au site public</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/db.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./login.js"></script>
  <script src="../assets/js/animations.js"></script>
</body>
</html>
